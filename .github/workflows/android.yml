name: Build COSC APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check RGBA pixel layouts (no Android runtime)
        run: |
          javac -d /tmp/cosc-pixel-check app/src/main/java/com/tanuki276/cosc/RgbaSampler.java tools/checks/RgbaSamplerCheck.java
          java -cp /tmp/cosc-pixel-check com.tanuki276.cosc.RgbaSamplerCheck
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: COSC-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
