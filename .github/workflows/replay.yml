name: Original CO-DUG 100000m replay
on:
  pull_request:
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 42, 276]
    env:
      REPLAY_SEEDS: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tanuki276/co-dugapk
          ref: 267b0b54eb687cf74daedfbee62f1bc216030d5c
          path: .replay-game
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test canvas outside app
        run: npm install --no-save --no-package-lock @napi-rs/canvas@0.1.80
      - name: Replay production analyzer against original renderer and collisions
        run: bash tools/replay/run.sh .replay-game
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codug-replay-${{ matrix.seed }}
          path: replay-output/
